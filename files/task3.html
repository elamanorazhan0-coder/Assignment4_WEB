<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 3 - Bootstrap Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Contact Us</h1>

        <form id="myForm" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Your name">
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Email is required and must be correct</div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Your message"></textarea>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Message must be at least 10 characters</div>
            </div>

            <button type="submit" class="btn btn-primary">Send</button>
        </form>
    </div>

    <script>
        var form = document.getElementById("myForm");
        var nameInput = document.getElementById("name");
        var emailInput = document.getElementById("email");
        var messageInput = document.getElementById("message");

        function check(input, isOk) {
            if (isOk) {
                input.classList.remove("is-invalid");
                input.classList.add("is-valid");
            } else {
                input.classList.remove("is-valid");
                input.classList.add("is-invalid");
            }
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault(); // dont send the form

            check(nameInput, nameInput.value.trim() !== "");
            check(emailInput, emailInput.checkValidity() && emailInput.value !== "");
            check(messageInput, messageInput.value.trim().length >= 10);
        });
    </script>
</body>
</html>
